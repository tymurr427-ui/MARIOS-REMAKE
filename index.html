<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Super Plumber Bros</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }
  #wrap {
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    overflow:hidden;
  }
  canvas {
    display:block;
    background:linear-gradient(#5c94fc, #a8d8ff);
    image-rendering: pixelated;
    width:100%;
    height:100%;
  }

  .screen {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    background:
      radial-gradient(circle at 20% 20%, #7ec8ff 0%, transparent 40%),
      linear-gradient(#3a6ee8, #123a99 60%, #041333);
    color:#fff;
    text-align:center;
    z-index:10;
  }
  .hidden { display:none !important; }

  .title {
    font-size:min(9vw, 56px);
    font-weight:900;
    letter-spacing:2px;
    color:#ffd23f;
    text-shadow:
      4px 4px 0 #c0392b,
      -2px -2px 0 #7a1f0f,
      6px 6px 0 rgba(0,0,0,.4);
    font-family: 'Impact', 'Arial Black', sans-serif;
    transform: skew(-3deg);
  }
  .subtitle {
    font-size:14px;
    color:#ffe9a8;
    letter-spacing:4px;
    margin-top:-8px;
  }

  .menu-btn {
    width:240px;
    padding:14px 0;
    font-size:20px;
    font-weight:bold;
    color:#fff;
    background:linear-gradient(#e74c3c,#c0392b);
    border:4px solid #7a1f0f;
    border-radius:8px;
    cursor:pointer;
    letter-spacing:2px;
    box-shadow:0 6px 0 #7a1f0f, 0 8px 10px rgba(0,0,0,.4);
    transition: transform .08s ease;
    font-family:inherit;
  }
  .menu-btn:hover { filter:brightness(1.15); }
  .menu-btn:active { transform:translateY(6px); box-shadow:0 0 0 #7a1f0f; }
  .menu-btn.blue { background:linear-gradient(#3498db,#1f618d); border-color:#123a5c; box-shadow:0 6px 0 #123a5c,0 8px 10px rgba(0,0,0,.4); }
  .menu-btn.blue:active { box-shadow:0 0 0 #123a5c; }
  .menu-btn.green { background:linear-gradient(#2ecc71,#1e8449); border-color:#0e4a26; box-shadow:0 6px 0 #0e4a26,0 8px 10px rgba(0,0,0,.4); }
  .menu-btn.green:active { box-shadow:0 0 0 #0e4a26; }
  .menu-btn.purple { background:linear-gradient(#9b59b6,#5e3370); border-color:#3a1f47; box-shadow:0 6px 0 #3a1f47,0 8px 10px rgba(0,0,0,.4); }
  .menu-btn.purple:active { box-shadow:0 0 0 #3a1f47; }
  .menu-btn.small { width:auto; padding:10px 22px; font-size:15px; }

  .coin-tally {
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(0,0,0,.35);
    padding:8px 14px;
    border-radius:20px;
    font-weight:bold;
    font-size:16px;
    color:#ffd23f;
  }
  .coin-icon {
    width:18px; height:18px;
    background:radial-gradient(circle at 35% 30%, #fff6c9, #ffd23f 40%, #c8860a 100%);
    border-radius:50%;
    border:2px solid #8a5a00;
    flex-shrink:0;
  }

  /* SHOP */
  .shop-layout {
    display:flex;
    gap:24px;
    align-items:flex-start;
    justify-content:center;
  }
  .shop-preview {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    background:rgba(0,0,0,.25);
    border:3px solid rgba(255,255,255,.25);
    border-radius:12px;
    padding:14px 18px;
  }
  #previewCanvas {
    background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.12), transparent 70%);
    border-radius:8px;
  }
  .preview-name {
    font-weight:bold;
    font-size:15px;
    color:#ffd23f;
  }
  .shop-grid {
    display:grid;
    grid-template-columns:repeat(3, 150px);
    gap:16px;
    margin:10px 0;
    max-height:44vh;
    overflow-y:auto;
  }
  .skin-card {
    background:rgba(255,255,255,.08);
    border:3px solid rgba(255,255,255,.25);
    border-radius:10px;
    padding:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
  }
  .skin-card.selected { border-color:#ffd23f; box-shadow:0 0 12px #ffd23f; }
  .skin-card.previewed { border-color:#7fd6ff; box-shadow:0 0 10px rgba(127,214,255,.6); }
  .skin-card.locked { opacity:.55; }
  #btnBuyEquip:disabled { opacity:.5; cursor:not-allowed; filter:grayscale(.4); }
  .settings-panel {
    display:flex;
    flex-direction:column;
    gap:16px;
    background:rgba(0,0,0,.3);
    border:2px solid rgba(255,255,255,.2);
    border-radius:14px;
    padding:20px 28px;
    min-width:320px;
  }
  .settings-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    color:#fff;
    font-weight:bold;
    font-size:15px;
  }
  .volume-slider {
    flex:1;
    accent-color:#ffd23f;
    height:6px;
  }
  #volumeValue { min-width:38px; text-align:right; font-size:13px; color:#ffe27a; }
  .mp-code-input {
    width:100%;
    padding:10px;
    font-size:22px;
    text-align:center;
    letter-spacing:6px;
    font-weight:900;
    text-transform:uppercase;
    border-radius:8px;
    border:2px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.1);
    color:#fff;
  }
  .mp-code-input::placeholder { color:rgba(255,255,255,.4); letter-spacing:4px; }
  .mp-error { color:#ff8a8a; font-size:13px; min-height:18px; font-weight:bold; }
  .mp-code-box {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .mp-code-display {
    font-size:48px;
    font-weight:900;
    letter-spacing:10px;
    color:#ffd23f;
    background:rgba(0,0,0,.35);
    padding:14px 24px;
    border-radius:14px;
    border:3px solid rgba(255,255,255,.25);
  }
  .mp-status {
    font-size:15px;
    color:#cfe3ff;
    min-height:22px;
  }
  .remote-nametag {
    position:absolute;
    background:rgba(0,0,0,.55);
    color:#fff;
    font-size:11px;
    font-weight:bold;
    padding:2px 8px;
    border-radius:10px;
    transform:translate(-50%,-100%);
    white-space:nowrap;
    z-index:4;
    pointer-events:none;
  }
  .mp-hud-pill {
    position:absolute;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(217,102,14,.75);
    border:2px solid #7a3a05;
    color:#fff;
    font-weight:bold;
    font-size:13px;
    padding:5px 14px;
    border-radius:16px;
    z-index:5;
  }
  .quality-buttons {
    display:flex;
    gap:6px;
  }
  .quality-btn {
    background:rgba(255,255,255,.1);
    border:2px solid rgba(255,255,255,.25);
    color:#fff;
    font-weight:bold;
    font-size:11px;
    padding:6px 10px;
    border-radius:8px;
    cursor:pointer;
    letter-spacing:1px;
  }
  .quality-btn:hover { background:rgba(255,255,255,.2); }
  .quality-btn.active {
    background:linear-gradient(#ffd23f,#c8860a);
    border-color:#8a5a00;
    color:#3a2600;
  }
  .skin-name { font-size:13px; font-weight:bold; }
  .skin-price { font-size:12px; color:#ffd23f; }
  .skin-thumb { width:64px; height:82px; }
  .buy-tag {
    font-size:11px;
    background:#2ecc71;
    padding:2px 8px;
    border-radius:10px;
    color:#053;
    font-weight:bold;
  }

  /* LEVEL SELECT */
  .level-grid {
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
    max-width:600px;
  }
  .level-card {
    width:120px;
    height:90px;
    background:rgba(255,255,255,.1);
    border:3px solid rgba(255,255,255,.3);
    border-radius:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-weight:bold;
  }
  .level-card.locked { opacity:.4; cursor:not-allowed; }
  .level-card span.num { font-size:26px; color:#ffd23f; }
  .level-card span.lbl { font-size:11px; color:#cfe3ff; }

  #hud {
    position:absolute;
    top:14px; left:14px;
    color:#fff;
    font-weight:bold;
    font-size:17px;
    text-shadow:2px 2px 0 #000;
    display:flex;
    gap:14px;
    z-index:5;
  }
  .hud-pill {
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(0,0,0,.45);
    border:2px solid rgba(255,255,255,.25);
    padding:6px 14px 6px 8px;
    border-radius:24px;
    backdrop-filter:blur(2px);
  }
  .hud-coin-icon {
    width:26px; height:26px;
    border-radius:50%;
    position:relative;
    background:
      radial-gradient(circle at 32% 28%, #fffbe0 0%, #ffe27a 22%, #ffc93f 48%, #d68e0f 78%, #8a5a00 100%);
    border:2px solid #8a5a00;
    box-shadow:inset 0 -3px 4px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.6);
  }
  .hud-coin-icon::after {
    content:"$";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    color:#8a5a00;
    font-family:'Arial Black', sans-serif;
    text-shadow:0 1px 0 rgba(255,255,255,.5);
  }
  .hud-heart-icon { font-size:20px; filter:drop-shadow(1px 2px 0 #000); }
  #hudCoins, #hudLives { font-size:20px; }
  .coin-pop {
    position:absolute;
    font-weight:900;
    color:#ffe27a;
    text-shadow:2px 2px 0 #000;
    font-size:20px;
    pointer-events:none;
    z-index:20;
    animation: coinPop .7s ease-out forwards;
  }
  @keyframes coinPop {
    0%   { transform:translateY(0); opacity:1; }
    100% { transform:translateY(-38px); opacity:0; }
  }
  #pauseBtn, #fsBtn, #muteBtn {
    position:absolute;
    top:10px;
    z-index:5;
    background:rgba(0,0,0,.4);
    border:2px solid #fff;
    color:#fff;
    border-radius:6px;
    padding:4px 10px;
    cursor:pointer;
    font-weight:bold;
  }
  #pauseBtn { right:10px; }
  #fsBtn { right:100px; }
  #muteBtn { right:270px; }
  .msg-banner {
    position:absolute;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:min(6vw, 40px);
    font-weight:900;
    color:#ffd23f;
    text-shadow:3px 3px 0 #000;
    z-index:6;
    text-align:center;
    white-space:pre-line;
  }
  .small-note {
    font-size:12px;
    color:#cfe3ff;
    max-width:420px;
  }
  .auth-box {
    margin-top:6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .auth-note {
    font-size:12px;
    color:#cfe3ff;
    background:rgba(0,0,0,.3);
    padding:6px 12px;
    border-radius:10px;
  }
  .auth-logged-pill {
    display:flex;
    align-items:center;
    gap:8px;
    background:linear-gradient(#2ecc71,#1e8449);
    border:2px solid #0e4a26;
    padding:6px 14px 6px 6px;
    border-radius:24px;
    font-size:13px;
    font-weight:bold;
    color:#fff;
    box-shadow:0 3px 0 #0e4a26;
  }
  .auth-avatar {
    width:24px; height:24px;
    border-radius:50%;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    color:#1e8449;
    overflow:hidden;
    flex-shrink:0;
  }
  .auth-avatar img { width:100%; height:100%; object-fit:cover; }
  .global-auth-badge {
    position:absolute;
    top:12px; right:12px;
    z-index:30;
    pointer-events:none;
  }
  .global-auth-badge .auth-logged-pill { pointer-events:auto; font-size:12px; padding:4px 10px 4px 4px; }

  .leaderboard-panel {
    position:absolute;
    top:12px; left:12px;
    z-index:30;
    background:rgba(10,10,25,.55);
    border:2px solid rgba(255,255,255,.25);
    border-radius:12px;
    padding:10px 14px;
    min-width:190px;
    backdrop-filter:blur(2px);
    color:#fff;
  }
  .lb-title {
    font-weight:900;
    font-size:13px;
    color:#ffd23f;
    margin-bottom:6px;
    letter-spacing:1px;
  }
  .lb-row {
    display:grid;
    grid-template-columns:18px 1fr auto auto;
    gap:6px;
    align-items:center;
    font-size:12px;
    padding:2px 0;
    white-space:nowrap;
  }
  .lb-row.me { color:#ffd23f; font-weight:bold; }
  .lb-rank { opacity:.7; }
  .lb-name { overflow:hidden; text-overflow:ellipsis; max-width:70px; }
  .lb-coins { color:#ffe27a; }
  .lb-time { opacity:.75; }
  .lb-empty { font-size:11px; color:#cfe3ff; opacity:.7; }
</style>
</head>
<body>
<div id="wrap">
  <div id="globalAuthBadge" class="global-auth-badge"></div>
  <div id="leaderboardBox" class="leaderboard-panel"></div>

  <!-- MENU -->
  <div id="menuScreen" class="screen">
    <div class="title">SUPER PLUMBER BROS</div>
    <div class="subtitle">ZBIERAJ MONETY • SKACZ • WYGRYWAJ</div>
    <div class="coin-tally"><div class="coin-icon"></div><span id="menuCoins">0</span></div>
    <button class="menu-btn" id="btnPlay">▶ GRAJ</button>
    <button class="menu-btn purple" id="btnLevels">🗺 POZIOMY</button>
    <button class="menu-btn blue" id="btnShop">🛒 SKLEP</button>
    <button class="menu-btn" id="btnMultiplayer" style="background:linear-gradient(#ff9f4a,#d9660e); border-color:#7a3a05; box-shadow:0 6px 0 #7a3a05,0 8px 10px rgba(0,0,0,.4);">👥 MULTIPLAYER</button>
    <button class="menu-btn green" id="btnSettings">⚙ USTAWIENIA</button>
    <div id="authBox" class="auth-box"></div>
  </div>

  <!-- MULTIPLAYER: WYBOR -->
  <div id="mpChoiceScreen" class="screen hidden">
    <div class="title" style="font-size:36px;">MULTIPLAYER</div>
    <div class="small-note">Graj razem ze znajomym na dwoch ekranach naraz.</div>
    <button class="menu-btn" id="btnMpCreate">🆕 STWÓRZ LOBBY</button>
    <div class="settings-panel" style="min-width:280px;">
      <div class="settings-row" style="flex-direction:column; align-items:stretch; gap:10px;">
        <span>Dołącz z kodem</span>
        <input type="text" id="mpCodeInput" maxlength="5" placeholder="np. AB3XQ" class="mp-code-input">
        <button class="menu-btn small" id="btnMpJoin" style="align-self:center;">🔗 DOŁĄCZ</button>
      </div>
    </div>
    <div id="mpError" class="mp-error"></div>
    <button class="menu-btn small" id="btnMpChoiceBack">⬅ POWRÓT</button>
  </div>

  <!-- MULTIPLAYER: LOBBY / OCZEKIWANIE -->
  <div id="mpLobbyScreen" class="screen hidden">
    <div class="title" style="font-size:32px;">LOBBY</div>
    <div id="mpLobbyCodeBox" class="mp-code-box hidden">
      <div class="small-note">Podaj ten kod znajomemu:</div>
      <div id="mpLobbyCode" class="mp-code-display">-----</div>
    </div>
    <div id="mpLobbyStatus" class="mp-status">Łączenie...</div>
    <button class="menu-btn small" id="btnMpCancel">✖ ANULUJ</button>
  </div>

  <!-- SETTINGS -->
  <div id="settingsScreen" class="screen hidden">
    <div class="title" style="font-size:36px;">USTAWIENIA</div>
    <div class="settings-panel">
      <div class="settings-row">
        <span>Muzyka</span>
        <button class="menu-btn small" id="btnMuteMenu">🔊 WŁĄCZONA</button>
      </div>
      <div class="settings-row">
        <span>Głośność</span>
        <input type="range" id="volumeSlider" min="0" max="100" value="56" class="volume-slider">
        <span id="volumeValue">56%</span>
      </div>
      <div class="settings-row" style="align-items:flex-start;">
        <span>Grafika</span>
        <div class="quality-buttons" id="qualityButtons">
          <button class="quality-btn" data-q="low">LOW</button>
          <button class="quality-btn" data-q="medium">MEDIUM</button>
          <button class="quality-btn" data-q="high">HIGH</button>
          <button class="quality-btn" data-q="ultra">ULTRA</button>
        </div>
      </div>
    </div>
    <button class="menu-btn small" id="btnSettingsBack">⬅ POWRÓT</button>
  </div>

  <!-- LEVEL SELECT -->
  <div id="levelScreen" class="screen hidden">
    <div class="title" style="font-size:34px;">WYBIERZ POZIOM</div>
    <div class="level-grid" id="levelGrid"></div>
    <button class="menu-btn small" id="btnLevelsBack">⬅ POWRÓT</button>
  </div>

  <!-- SHOP -->
  <div id="shopScreen" class="screen hidden">
    <div class="title" style="font-size:36px;">SKLEP ZE SKÓRKAMI</div>
    <div class="coin-tally"><div class="coin-icon"></div><span id="shopCoins">0</span></div>
    <div class="shop-layout">
      <div class="shop-grid" id="shopGrid"></div>
      <div class="shop-preview">
        <canvas id="previewCanvas" width="180" height="240"></canvas>
        <div class="preview-name" id="previewName">Klasyczny</div>
        <button class="menu-btn small" id="btnRotate">🔄 OBRÓĆ</button>
        <button class="menu-btn" id="btnBuyEquip">✅ ZAŁÓŻ</button>
      </div>
    </div>
    <button class="menu-btn small" id="btnBack">⬅ POWRÓT</button>
  </div>

  <!-- GAME -->
  <div id="gameScreen" class="hidden">
    <div id="hud">
      <div class="hud-pill"><div class="hud-coin-icon"></div><span id="hudCoins">0</span></div>
      <div class="hud-pill"><span class="hud-heart-icon">❤</span><span id="hudLives">3</span></div>
      <div class="hud-pill">Poziom <span id="hudLevel">1</span></div>
    </div>
    <button id="fsBtn">⛶ PEŁNY EKRAN</button>
    <button id="muteBtn" style="left:auto;">🔊</button>
    <button id="pauseBtn">MENU</button>
    <div id="mpHudPill" class="mp-hud-pill hidden"></div>
    <div id="remoteNametag" class="remote-nametag hidden"></div>
    <canvas id="game"></canvas>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  // ---------- SUPABASE (konta Google + zapis postepu) ----------
  // 1. Zaloz darmowy projekt na https://supabase.com
  // 2. Wklej ponizej swoj Project URL i "anon public" key (Settings -> API)
  // 3. Wlacz logowanie Google: Authentication -> Providers -> Google
  // 4. Ustaw Site URL / Redirect URL na adres, pod ktorym hostujesz ten plik (Netlify/Vercel/GitHub Pages)
  // 5. Odpal ponizszy SQL w Supabase -> SQL Editor (tabela + zabezpieczenia RLS):
  //
  //   create table public.profiles (
  //     id uuid references auth.users on delete cascade primary key,
  //     wallet integer default 0,
  //     owned_skins jsonb default '["classic"]'::jsonb,
  //     equipped_skin text default 'classic',
  //     unlocked_level integer default 0,
  //     updated_at timestamptz default now()
  //   );
  //   alter table public.profiles enable row level security;
  //   create policy "select own" on public.profiles for select using (auth.uid() = id);
  //   create policy "update own" on public.profiles for update using (auth.uid() = id);
  //   create policy "insert own" on public.profiles for insert with check (auth.uid() = id);
  //
  const SUPABASE_URL = 'https://fbijztkbisfdtodfwudo.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_16EaCUKwWvnbl4OGXmIH2Q_EVlgIsGD';
  const supabaseReady = SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 20;
  const sb = supabaseReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  let currentUser = null;
  let saveTimer = null;

  // ---------- MULTIPLAYER (Supabase Realtime: Broadcast + Presence) ----------
  const myId = 'p-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  let mpChannel = null;
  let mpCode = '';
  let isHost = false;
  let mpConnected = false;
  let remotePlayer = null;      // ostatnie dane o pozycji drugiego gracza
  let remoteLastSeen = 0;
  let remoteDead = false;       // czy drugi gracz stracil wszystkie zycia
  let mpRestarting = false;     // zabezpieczenie przed podwojnym restartem
  let mpBroadcastTimer = 0;

  function generateLobbyCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // bez znakow latwych do pomylenia
    let out = '';
    for(let i=0;i<5;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }

  function leaveMultiplayer(){
    if(mpChannel){
      try { sb.removeChannel(mpChannel); } catch(e){}
    }
    mpChannel = null;
    mpConnected = false;
    isHost = false;
    mpCode = '';
    remotePlayer = null;

  function setupMpChannel(code, hosting){
    if(!sb){
      document.getElementById('mpError').textContent = 'Multiplayer wymaga skonfigurowanego konta (Supabase).';
      return;
    }
    if(mpChannel){ try{ sb.removeChannel(mpChannel); }catch(e){} }
    mpCode = code;
    isHost = hosting;
    mpConnected = false;
    remotePlayer = null;

    mpChannel = sb.channel('mp-' + code, { config: { presence: { key: myId }, broadcast: { self: false } } });

    mpChannel.on('broadcast', { event: 'state' }, ({ payload }) => {
      if(!payload || payload.from === myId) return;
      remotePlayer = payload;
      remoteLastSeen = Date.now();
    });

    mpChannel.on('broadcast', { event: 'coin' }, ({ payload }) => {
      if(!payload || payload.from === myId) return;
      if(level && level.coins && level.coins[payload.idx]){
        level.coins[payload.idx].taken = true;
      }
    });

    mpChannel.on('broadcast', { event: 'enemy_dead' }, ({ payload }) => {
      if(!payload || payload.from === myId) return;
      if(level && level.enemies && level.enemies[payload.idx]){
        level.enemies[payload.idx].alive = false;
      }
    });

    mpChannel.on('broadcast', { event: 'level_advance' }, ({ payload }) => {
      if(!payload || payload.from === myId) return;
      mpRestarting = false;
      remoteDead = false;
      if(payload.idx === null){
        showBanner('TWÓJ WSPÓŁGRACZ UKOŃCZYŁ WSZYSTKIE POZIOMY!', () => { leaveMultiplayer(); showScreen('menu'); });
      } else {
        levelDone = true;
        showBanner('WSPÓŁGRACZ PRZESZEDŁ DALEJ!\nPrzechodzimy razem...', () => startLevel(payload.idx));
      }
    });

    mpChannel.on('broadcast', { event: 'player_dead' }, ({ payload }) => {
      if(!payload || payload.from === myId) return;
      remoteDead = true;
      if(player.spectating && !mpRestarting){
        mpRestarting = true;
        broadcastEvent('level_advance', { idx: currentLevelIndex });
        showBanner('OBAJ PRZEGRALIŚCIE - RESTART POZIOMU', () => startLevel(currentLevelIndex));
      } else if(!player.spectating){
        document.getElementById('mpHudPill').textContent = '👥 MULTIPLAYER · ' + mpCode + ' · współgracz zginął, gra dalej!';
      }
    });

    mpChannel.on('presence', { event: 'sync' }, () => {
      const st = mpChannel.presenceState();
      const count = Object.keys(st).length;
      const statusEl = document.getElementById('mpLobbyStatus');
      if(count >= 2){
        mpConnected = true;
        if(statusEl) statusEl.textContent = '✅ Gracz 2 dołączył! Startujemy...';
        setTimeout(() => {
          if(mpConnected) startMultiplayerGame();
        }, 700);
      } else if(statusEl){
        statusEl.textContent = isHost
          ? 'Czekam na drugiego gracza...'
          : 'Łączenie z lobby ' + code + '...';
      }
    });

    mpChannel.subscribe(async (status) => {
      if(status === 'SUBSCRIBED'){
        await mpChannel.track({ joinedAt: Date.now() });
      } else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){
        const statusEl = document.getElementById('mpLobbyStatus');
        if(statusEl) statusEl.textContent = '⚠ Nie udało się połączyć. Spróbuj ponownie.';
      }
    });
  }

  function drawRemotePlayer(){
    const tag = document.getElementById('remoteNametag');
    if(!mpChannel || !remotePlayer || Date.now() - remoteLastSeen > 4000){
      tag.classList.add('hidden');
      return;
    }
    const sk = SKINS.find(s => s.id === remotePlayer.skin) || SKINS[0];
    const rx = remotePlayer.x - camera.x;
    const ry = remotePlayer.y;
    const scale = 38/40;
    const airborne = !remotePlayer.onGround;
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.translate(rx + 19, ry + 28*scale);
    ctx.scale((remotePlayer.facing||1)*scale, scale);
    ctx.translate(-20, -28);
    drawCharacterSprite(ctx, sk.colors, 0, airborne, gfxQuality===0, gfxQuality>=2, false);
    ctx.restore();

    // dymek z nazwa nad postacia (pozycjonowany w ukladzie DOM, nie canvas)
    const canvasRect = document.getElementById('game').getBoundingClientRect();
    const scaleX = canvasRect.width / W;
    const scaleY = canvasRect.height / H;
    tag.textContent = remotePlayer.name || 'Gracz 2';
    tag.style.left = (canvasRect.left + rx*scaleX + 19*scaleX) + 'px';
    tag.style.top = (canvasRect.top + ry*scaleY - 6*scaleY) + 'px';
    tag.classList.remove('hidden');
  }

    tctx.save();
    tctx.translate(canvas.width/2, 4);

  function renderPreviewFrame(){
    const canvas = document.getElementById('previewCanvas');

    const sk = SKINS.find(s => s.id === previewSkinId) || SKINS[0];
    const bob = Math.sin(previewT) * 2;
    previewT += 0.06;
    const scale = 3.0;
    pctx.save();
    pctx.translate(canvas.width/2, 12);
    pctx.scale(previewFacing*scale, scale);
    pctx.translate(-20, 0);
    drawCharacterSprite(pctx, sk.colors, bob, false, false, true, true);
    pctx.restore();
    previewRaf = requestAnimationFrame(renderPreviewFrame);
  }

  // ---------- AUDIO (wlasna, syntezowana muzyka - bez zadnych cudzych nagran) ----------
  const AudioEngine = (function(){
    let ctx, masterGain;
    let musicOn = true;
    let melodyTimer = null;
    let melodyIndex = 0;
    let volume = 0.28; // 0..0.5 (glosnosc bazowa)

    // prosta, oryginalna melodyjka w stylu chiptune (nuty w Hz, dlugosc w sek; 0 = pauza)
    const MELODY = [
      [523,0.2],[0,0.05],[523,0.2],[0,0.05],[659,0.2],[0,0.05],[523,0.2],[0,0.05],
      [784,0.4],[0,0.15],[698,0.4],[0,0.15],
      [659,0.2],[0,0.05],[587,0.2],[0,0.05],[523,0.4],[0,0.2],
      [440,0.2],[0,0.05],[523,0.2],[0,0.05],[587,0.4],[0,0.3],
    ];

    function ensureCtx(){
      if(!ctx){
        ctx = new (window.AudioContext||window.webkitAudioContext)();
        masterGain = ctx.createGain();
        masterGain.gain.value = volume;
        masterGain.connect(ctx.destination);
      }
      if(ctx.state === 'suspended') ctx.resume();
    }

    function tone(freq, delay, dur, type, vol){
      if(!ctx || freq<=0) return;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      o.connect(g); g.connect(masterGain);
      const t0 = ctx.currentTime + delay;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime((vol!==undefined?vol:0.4), t0+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      o.start(t0);
      o.stop(t0+dur+0.02);
    }

    function scheduleMusic(){
      if(!musicOn) return;
      ensureCtx();
      clearTimeout(melodyTimer);
      function step(){
        if(!musicOn) return;
        const [freq,dur] = MELODY[melodyIndex % MELODY.length];
        if(freq>0) tone(freq, 0, dur*0.85, 'triangle', 0.22);
        melodyIndex++;
        melodyTimer = setTimeout(step, dur*1000);
      }
      step();
    }
    function stopMusic(){ clearTimeout(melodyTimer); melodyTimer = null; }
    function toggleMusic(){
      musicOn = !musicOn;
      if(musicOn) scheduleMusic(); else stopMusic();
      return musicOn;
    }
    function setVolume(v){
      volume = Math.max(0, Math.min(0.5, v));
      if(masterGain) masterGain.gain.value = volume;
    }
    function getVolume(){ return volume; }

    return {
      ensureCtx,
      startIfNeeded(){ ensureCtx(); if(musicOn && !melodyTimer) scheduleMusic(); },
      sfxJump(){ ensureCtx(); tone(600,0,0.08,'square',0.3); tone(880,0.05,0.1,'square',0.25); },
      sfxCoin(){ ensureCtx(); tone(988,0,0.07,'square',0.3); tone(1318,0.06,0.12,'square',0.3); },
      sfxStomp(){ ensureCtx(); tone(150,0,0.14,'square',0.35); },
      sfxHurt(){ ensureCtx(); tone(300,0,0.1,'sawtooth',0.3); tone(180,0.1,0.22,'sawtooth',0.3); },
      sfxWin(){ ensureCtx(); [523,659,784,1046].forEach((f,i)=>tone(f,i*0.13,0.18,'square',0.3)); },
      sfxLose(){ ensureCtx(); [392,349,311,262].forEach((f,i)=>tone(f,i*0.16,0.22,'sawtooth',0.3)); },
      toggleMusic,
      setVolume,
      getVolume,
      isOn(){ return musicOn; }
    };
  })();

  function resetPlayerPosition(){

  function takeDamage(){
    if(player.invuln > 0) return;
    lives--;
    document.getElementById('hudLives').textContent = lives;
    AudioEngine.sfxHurt();
    if(lives <= 0){
      if(mpChannel && !player.spectating){
        player.spectating = true;
        document.getElementById('hudLives').textContent = 0;
        broadcastEvent('player_dead', {});
        if(remoteDead && !mpRestarting){
          mpRestarting = true;
          broadcastEvent('level_advance', { idx: currentLevelIndex });
          showBanner('OBAJ PRZEGRALIŚCIE - RESTART POZIOMU', () => startLevel(currentLevelIndex));
        } else {
          showBanner('NIE ŻYJESZ\nOglądasz współgracza...', () => {});
          document.getElementById('mpHudPill').classList.remove('hidden');
          document.getElementById('mpHudPill').textContent = '💀 Nie żyjesz - oglądasz współgracza';
        }
      } else if(!mpChannel){
        levelDone = true;
        finishRun(false);
      }
    } else {
      resetPlayerPosition();
    }
  }

  function updateEnemies(){
    level.enemies.forEach((e, idx) => {
      if(!e.alive) return;
      e.animT = (e.animT||0) + 0.09;

      if(e.type === 'flyer'){
        e.x += e.vx;
        if(e.x < e.minX){ e.x = e.minX; e.vx = Math.abs(e.vx); }
        if(e.x + e.w > e.maxX){ e.x = e.maxX - e.w; e.vx = -Math.abs(e.vx); }
        e.y = e.baseY + Math.sin(e.animT*0.6) * (e.amp||30);
      } else if(e.type === 'jumper'){
        const hop = Math.abs(Math.sin(e.animT*0.5));
        e.y = e.baseY - hop*(e.jumpHeight||70);
      } else {
        e.x += e.vx;
        if(e.x < e.minX){ e.x = e.minX; e.vx = Math.abs(e.vx); }
        if(e.x + e.w > e.maxX){ e.x = e.maxX - e.w; e.vx = -Math.abs(e.vx); }
      }

      if(player.invuln <= 0){
        if(rectsOverlap(player, e)){
          const stomp = player.vy > 0 && (player.y + player.h - e.y) < 20;
          if(stomp){
            e.alive = false;
            player.vy = -9.5;
            player.invuln = 20;
            runCoins += 1;
            document.getElementById('hudCoins').textContent = runCoins;
            AudioEngine.sfxStomp();
            spawnCoinPop();
            broadcastEvent('enemy_dead', { idx });
          } else {
            takeDamage();
          }
        }
      }
    });
  }

  function updateHazards(){
    if(!level.hazards) return;
    if(player.invuln > 0) return;
    for(const h of level.hazards){
      if(rectsOverlap(player, h)) takeDamage();
    }
  }

  function updateMovers(){
    if(!level.movers) return;
    for(const m of level.movers){
      const oldX = m.x, oldY = m.y;
      m.t = (m.t||0) + 0.02*(m.speed||1);
      if(m.axis === 'x') m.x = m.baseX + Math.sin(m.t)*m.range;
      else m.y = m.baseY + Math.sin(m.t)*m.range;
      m.dx = m.x - oldX;
      m.dy = m.y - oldY;
    }
  }

  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  // ---------- ORYGINALNE TEMPO MARIO ----------
  // Klasyczne NES Mario: chód ~1.5 px/klatke w jednostkach gry, bieg szybszy,
  // przyspieszenie/tarcie zamiast natychmiastowej predkosci, skok zmiennej wysokosci.
  const WALK_MAX = 2.6;
  const RUN_MAX = 5.0;
  const ACCEL = 0.32;
  const DECEL_GROUND = 0.36;
  const DECEL_AIR = 0.16;
  const JUMP_VELOCITY = -12.6;
  const JUMP_CUT = 0.45; // puszczenie skoku wczesniej -> nizszy skok

  function update(){
    if(levelDone) return;
    timeAlive++;

    if(player.spectating){
      updateMovers();
      level.coins.forEach(c => { if(!c.taken) c.t += 0.15; });
      level.enemies.forEach(e => {
        if(!e.alive) return;
        e.animT = (e.animT||0) + 0.09;
        if(e.type === 'flyer'){
          e.x += e.vx;
          if(e.x < e.minX){ e.x = e.minX; e.vx = Math.abs(e.vx); }
          if(e.x + e.w > e.maxX){ e.x = e.maxX - e.w; e.vx = -Math.abs(e.vx); }
          e.y = e.baseY + Math.sin(e.animT*0.6) * (e.amp||30);
        } else if(e.type === 'jumper'){
          const hop = Math.abs(Math.sin(e.animT*0.5));
          e.y = e.baseY - hop*(e.jumpHeight||70);
        } else {
          e.x += e.vx;
          if(e.x < e.minX){ e.x = e.minX; e.vx = Math.abs(e.vx); }
          if(e.x + e.w > e.maxX){ e.x = e.maxX - e.w; e.vx = -Math.abs(e.vx); }
        }
      });
      const followX = remotePlayer ? remotePlayer.x : player.x;
      camera.x = Math.max(0, Math.min(followX - W/2, level.width - W));
      return;
    }

    broadcastOwnState();

    const running = keys['ShiftLeft'] || keys['ShiftRight'];
    const maxSpeed = running ? RUN_MAX : WALK_MAX;

    if(keys['ArrowLeft']||keys['KeyA']){
      player.vx -= ACCEL * (running?1.4:1);
      if(player.vx < -maxSpeed) player.vx = -maxSpeed;
      player.facing = -1;
    } else if(keys['ArrowRight']||keys['KeyD']){
      player.vx += ACCEL * (running?1.4:1);
      if(player.vx > maxSpeed) player.vx = maxSpeed;
      player.facing = 1;
    } else {
      const dec = player.onGround ? DECEL_GROUND : DECEL_AIR;
      if(player.vx > 0){ player.vx -= dec; if(player.vx < 0) player.vx = 0; }
      else if(player.vx < 0){ player.vx += dec; if(player.vx > 0) player.vx = 0; }
    }

    const jumpHeld = keys['Space']||keys['ArrowUp']||keys['KeyW'];
    if(jumpHeld && player.onGround && !player.jumping){
      player.vy = JUMP_VELOCITY;
      player.onGround = false;
      player.jumping = true;
      AudioEngine.sfxJump();
    }
    if(!jumpHeld && player.vy < -JUMP_CUT*6){
      player.vy *= (1-JUMP_CUT*0.3);
    }
    if(player.onGround) player.jumping = false;

    player.vy += GRAVITY;
    if(player.vy > 16) player.vy = 16;

    updateMovers();
    const movers = level.movers || [];

    // ruch poziomy + kolizje
    player.x += player.vx;
    for(const p of [...level.platforms, ...level.pipes, ...movers]){
      if(rectsOverlap(player,p)){
        if(player.vx > 0){ player.x = p.x - player.w; player.vx = 0; }
        else if(player.vx < 0){ player.x = p.x + p.w; player.vx = 0; }
      }
    }
    if(player.x < 0){ player.x = 0; player.vx = 0; }

    // ruch pionowy + kolizje
    player.y += player.vy;
    player.onGround = false;
    let standingOnMover = null;
    for(const p of [...level.platforms, ...level.pipes, ...movers]){
      if(rectsOverlap(player,p)){
        if(player.vy > 0){
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
          if(p.isMover) standingOnMover = p;
        } else if(player.vy < 0){
          player.y = p.y + p.h;
          player.vy = 0;
        }
      }
    }
    if(standingOnMover) player.x += standingOnMover.dx;

    if(player.invuln > 0) player.invuln--;
    player.airTime = player.onGround ? 0 : player.airTime + 1;

    if(player.y > H + 150){
      takeDamage();
      if(levelDone) return;
    }

    updateEnemies();
    updateHazards();
    if(levelDone) return;

    level.coins.forEach((c, idx) => {
      if(!c.taken){
        c.t += 0.15;
        const cb = {x:c.x-10,y:c.y-10,w:20,h:20};
        if(rectsOverlap(player, cb)){
          c.taken = true;
          runCoins++;
          document.getElementById('hudCoins').textContent = runCoins;
          spawnCoinPop();
          AudioEngine.sfxCoin();
          broadcastEvent('coin', { idx });
        }
      }
    });

    if(rectsOverlap(player, level.flag)){
      levelDone = true;
      finishRun(true);
    }

    camera.x = Math.max(0, Math.min(player.x - W/2, level.width - W));
    player.animT += Math.abs(player.vx) * 0.22;
  }

  function finishRun(won){
    state.wallet += runCoins;
    if(won) AudioEngine.sfxWin(); else AudioEngine.sfxLose();
    if(won && currentLevelIndex === state.unlockedLevel && currentLevelIndex < LEVELS.length-1){
      state.unlockedLevel = currentLevelIndex + 1;
    }
    saveProfile();
    setTimeout(() => {
      if(mpChannel){
        if(won){
          if(currentLevelIndex < LEVELS.length-1){
            const nextIdx = currentLevelIndex + 1;
            broadcastEvent('level_advance', { idx: nextIdx });
            showBanner('POZIOM UKOŃCZONY!\n+' + runCoins + ' monet', () => startLevel(nextIdx));
          } else {
            broadcastEvent('level_advance', { idx: null });
            showBanner('UKOŃCZYLIŚCIE WSZYSTKIE POZIOMY!\n+' + runCoins + ' monet', () => { leaveMultiplayer(); showScreen('menu'); });
          }
        } else {
          const restartIdx = currentLevelIndex;
          broadcastEvent('level_advance', { idx: restartIdx });
          showBanner('PRZEGRANA - RESTART POZIOMU\n+' + runCoins + ' monet zebranych', () => startLevel(restartIdx));
        }
        return;
      }
      if(won){
        if(currentLevelIndex < LEVELS.length-1){
          showBanner('POZIOM UKOŃCZONY!\n+' + runCoins + ' monet', () => startLevel(currentLevelIndex+1));
        } else {
          showBanner('UKOŃCZYŁEŚ WSZYSTKIE POZIOMY!\n+' + runCoins + ' monet', () => showScreen('menu'));
        }
      } else {
        showBanner('GAME OVER\n+' + runCoins + ' monet zebranych', () => showScreen('menu'));
      }
    }, 200);
  }

  function spawnCoinPop(){
    const icon = document.querySelector('.hud-coin-icon');

    el.className = 'coin-pop';

    el.style.top = (rect.top - 2) + 'px';

    setTimeout(() => el.remove(), 700);

  function skinColors(){

    return sk.colors;
  }

  function drawCharacterSprite(targetCtx, c, bob, airborne, flat, shine, sparkle){
    const tctx = targetCtx;
    // ---- cien pod stopami ----
    if(!flat){
      tctx.fillStyle = 'rgba(0,0,0,.22)';
      tctx.beginPath();
      tctx.ellipse(20, 57, 15, 4, 0, 0, Math.PI*2);
      tctx.fill();
    }

    if(airborne){
      // ---- buty (podkurczone, skok) ----
      if(flat){ tctx.fillStyle = '#6b4118'; }
      else {
        const shoeGrad = tctx.createRadialGradient(13,44,2,13,46,10);
        shoeGrad.addColorStop(0,'#a9713a'); shoeGrad.addColorStop(1,'#6b4118');
        tctx.fillStyle = shoeGrad;
      }
      tctx.beginPath(); tctx.ellipse(13, 46, 8, 5.5, -0.3, 0, Math.PI*2); tctx.fill();
      tctx.beginPath(); tctx.ellipse(27, 46, 8, 5.5, 0.3, 0, Math.PI*2); tctx.fill();

      // ---- nogi podkurczone ----
      tctx.fillStyle = flat ? c.overalls : shade(c.overalls, -18);
      roundRectOn(tctx, 7, 36, 12, 12, 4); tctx.fill();
      roundRectOn(tctx, 21, 36, 12, 12, 4); tctx.fill();
    } else {
      // ---- buty ----
      if(flat){ tctx.fillStyle = '#6b4118'; }
      else {
        const shoeGrad = tctx.createRadialGradient(13,50,2,13,52,10);
        shoeGrad.addColorStop(0,'#a9713a'); shoeGrad.addColorStop(1,'#6b4118');
        tctx.fillStyle = shoeGrad;
      }
      tctx.beginPath(); tctx.ellipse(12, 52+bob, 9, 6, 0, 0, Math.PI*2); tctx.fill();
      tctx.beginPath(); tctx.ellipse(28, 52-bob, 9, 6, 0, 0, Math.PI*2); tctx.fill();

      // ---- nogi (overall) ----
      tctx.fillStyle = flat ? c.overalls : shade(c.overalls, -18);
      roundRectOn(tctx, 6, 38, 12, 16+bob, 4); tctx.fill();
      roundRectOn(tctx, 22, 38, 12, 16-bob, 4); tctx.fill();
    }

    // ---- tulow / kombinezon ----
    if(flat){ tctx.fillStyle = c.overalls; }
    else {
      const bodyGrad = tctx.createLinearGradient(4,20,36,44);
      bodyGrad.addColorStop(0, shade(c.overalls, 18));
      bodyGrad.addColorStop(1, shade(c.overalls, -12));
      tctx.fillStyle = bodyGrad;
    }
    roundRectOn(tctx, 4, 22, 32, 22, 8); tctx.fill();

    // szelki
    tctx.fillStyle = shade(c.overalls, -12);
    roundRectOn(tctx, 10, 15, 7, 10, 3); tctx.fill();
    roundRectOn(tctx, 23, 15, 7, 10, 3); tctx.fill();

    // guziki
    tctx.fillStyle = '#ffd23f';
    tctx.beginPath(); tctx.arc(13, 26, 2.6, 0, Math.PI*2); tctx.fill();
    tctx.beginPath(); tctx.arc(27, 26, 2.6, 0, Math.PI*2); tctx.fill();

    if(airborne){
      // ---- rece uniesione w gore (skok) ----
      tctx.fillStyle = flat ? c.shirt : (() => {
        const g = tctx.createLinearGradient(-4,0,4,20);
        g.addColorStop(0, shade(c.shirt,16)); g.addColorStop(1, shade(c.shirt,-10));
        return g;
      })();
      tctx.save();
      tctx.translate(3, 20); tctx.rotate(-0.55);
      roundRectOn(tctx, -5, -18, 10, 20, 5); tctx.fill();
      tctx.restore();
      tctx.save();
      tctx.translate(37, 20); tctx.rotate(0.55);
      roundRectOn(tctx, -5, -18, 10, 20, 5); tctx.fill();
      tctx.restore();

      // rekawiczki uniesione
      if(flat){ tctx.fillStyle = '#e8e8e8'; }
      else {
        const gloveGrad = tctx.createRadialGradient(1,0,1,1,0,7);
        gloveGrad.addColorStop(0,'#ffffff'); gloveGrad.addColorStop(1,'#d8d8d8');
        tctx.fillStyle = gloveGrad;
      }
      tctx.beginPath(); tctx.arc(-3, -1, 6.5, 0, Math.PI*2); tctx.fill();
      tctx.beginPath(); tctx.arc(43, -1, 6.5, 0, Math.PI*2); tctx.fill();
    } else {
      // ---- rece / rekawy ----
      if(flat){ tctx.fillStyle = c.shirt; }
      else {
        const sleeveGrad = tctx.createLinearGradient(-4,16,4,34);
        sleeveGrad.addColorStop(0, shade(c.shirt,16));
        sleeveGrad.addColorStop(1, shade(c.shirt,-10));
        tctx.fillStyle = sleeveGrad;
      }
      roundRectOn(tctx, -3, 17, 10, 20, 5); tctx.fill();
      roundRectOn(tctx, 33, 17, 10, 20, 5); tctx.fill();

      // rekawiczki
      if(flat){ tctx.fillStyle = '#e8e8e8'; }
      else {
        const gloveGrad = tctx.createRadialGradient(1,36,1,1,36,7);
        gloveGrad.addColorStop(0,'#ffffff'); gloveGrad.addColorStop(1,'#d8d8d8');
        tctx.fillStyle = gloveGrad;
      }
      tctx.beginPath(); tctx.arc(2, 36-bob*1.5, 6.5, 0, Math.PI*2); tctx.fill();
      tctx.beginPath(); tctx.arc(38, 36+bob*1.5, 6.5, 0, Math.PI*2); tctx.fill();
    }

    // ---- koszula pod szyja ----
    tctx.fillStyle = flat ? c.shirt : shade(c.shirt, 6);
    roundRectOn(tctx, 6, 16, 28, 9, 4); tctx.fill();

    // ---- glowa ----
    if(flat){ tctx.fillStyle = c.skin; }
    else {
      const headGrad = tctx.createRadialGradient(15,10,2,20,14,16);
      headGrad.addColorStop(0, shade(c.skin, 20));
      headGrad.addColorStop(1, shade(c.skin, -8));
      tctx.fillStyle = headGrad;
    }
    tctx.beginPath(); tctx.ellipse(20, 12, 13, 12, 0, 0, Math.PI*2); tctx.fill();

    // uszy
    tctx.fillStyle = shade(c.skin, -6);
    tctx.beginPath(); tctx.ellipse(8, 13, 3, 4, 0, 0, Math.PI*2); tctx.fill();

    // brwi
    tctx.strokeStyle = '#3a2a1a';
    tctx.lineWidth = 2.2;
    tctx.lineCap = 'round';
    if(airborne){
      tctx.beginPath(); tctx.moveTo(19, 5); tctx.quadraticCurveTo(25, 2, 31, 5); tctx.stroke();
    } else {
      tctx.beginPath(); tctx.moveTo(20, 6); tctx.quadraticCurveTo(25, 4, 30, 6.5); tctx.stroke();
    }

    // oczy (szerzej otwarte w skoku)
    tctx.fillStyle = '#fff';
    tctx.beginPath(); tctx.ellipse(24, airborne?9:10, 3.4, airborne?4.6:3.8, 0, 0, Math.PI*2); tctx.fill();
    tctx.fillStyle = '#2e6bd6';
    tctx.beginPath(); tctx.arc(25, airborne?9.5:10.5, 2, 0, Math.PI*2); tctx.fill();
    tctx.fillStyle = '#111';
    tctx.beginPath(); tctx.arc(25.6, airborne?9.2:10.2, 0.9, 0, Math.PI*2); tctx.fill();

    // nos
    tctx.fillStyle = flat ? c.skin : shade(c.skin, 8);
    tctx.beginPath(); tctx.ellipse(29, 14, 4.2, 3.4, 0, 0, Math.PI*2); tctx.fill();

    // wasy
    tctx.fillStyle = '#3a2a1a';
    tctx.beginPath();
    tctx.moveTo(18, 17);
    tctx.quadraticCurveTo(24, 14, 30, 17.5);
    tctx.quadraticCurveTo(24, 20.5, 18, 17);
    tctx.fill();

    // ---- czapka ----
    if(flat){ tctx.fillStyle = c.hat; }
    else {
      const hatGrad = tctx.createLinearGradient(4,-6,34,10);
      hatGrad.addColorStop(0, shade(c.hat, 22));
      hatGrad.addColorStop(1, shade(c.hat, -10));
      tctx.fillStyle = hatGrad;
    }
    roundRectOn(tctx, 5, -5, 28, 13, 7); tctx.fill();
    // daszek
    tctx.fillStyle = shade(c.hat, -14);
    tctx.beginPath();
    tctx.ellipse(11, 8, 9, 3.4, -0.15, 0, Math.PI*2);
    tctx.fill();
    // znaczek na czapce
    tctx.fillStyle = '#fff';
    tctx.beginPath(); tctx.arc(19, 1, 4.6, 0, Math.PI*2); tctx.fill();

    // HIGH+: polysk na czapce i kombinezonie (dodaje "blasku")
    if(shine && !flat){
      tctx.save();
      tctx.globalAlpha = 0.25;
      tctx.fillStyle = '#ffffff';
      tctx.beginPath();
      tctx.ellipse(11, 0, 7, 3, -0.4, 0, Math.PI*2);
      tctx.fill();
      tctx.beginPath();
      tctx.ellipse(11, 28, 6, 10, -0.3, 0, Math.PI*2);
      tctx.fill();
      tctx.restore();
      // delikatna obwodka wokol glowy (rim light)
      tctx.strokeStyle = 'rgba(255,255,255,.35)';
      tctx.lineWidth = 1;
      tctx.beginPath(); tctx.ellipse(20, 12, 13, 12, 0, -2.4, -0.6); tctx.stroke();
    }

    // ULTRA: iskierki
    if(sparkle){
      const t = (typeof performance !== 'undefined' ? performance.now() : Date.now()) * 0.004;
      drawSparkle(tctx, 34, -2, 4.5 + Math.sin(t)*1.8, t);
      drawSparkle(tctx, -1, 30, 3.6 + Math.cos(t*1.3)*1.5, t*1.4);
      drawSparkle(tctx, 39, 30, 3.2 + Math.sin(t*1.6)*1.4, t*1.7);
    }
  }

  function drawSparkle(tctx, x, y, r, rot){
    tctx.save();
    tctx.translate(x,y);
    tctx.rotate(rot);
    tctx.fillStyle = 'rgba(255,255,255,.85)';
    tctx.beginPath();
    tctx.moveTo(0,-r); tctx.lineTo(r*0.25,-r*0.25);
    tctx.lineTo(r,0); tctx.lineTo(r*0.25,r*0.25);
    tctx.lineTo(0,r); tctx.lineTo(-r*0.25,r*0.25);
    tctx.lineTo(-r,0); tctx.lineTo(-r*0.25,-r*0.25);
    tctx.closePath();
    tctx.fill();
    tctx.restore();
  }

  function roundRectOn(tctx, x,y,w,h,r){
    tctx.beginPath();
    tctx.moveTo(x+r,y);
    tctx.arcTo(x+w,y,x+w,y+h,r);
    tctx.arcTo(x+w,y+h,x,y+h,r);
    tctx.arcTo(x,y+h,x,y,r);
    tctx.arcTo(x,y,x+w,y,r);
    tctx.closePath();
  }
  function roundRect(x,y,w,h,r){ roundRectOn(ctx,x,y,w,h,r); }

  function drawPlayer(){
    const c = skinColors();
    const px = player.x - camera.x;
    const py = player.y;
    // sprite zaprojektowany w lokalnym ukladzie: szer ~40, wys ~56 (0,0 = czubek czapki)
    const scale = player.w/40;
    const airborne = !player.onGround;
    const bob = player.onGround ? Math.sin(player.animT)*1.5 : 0;
    const flat = gfxQuality === 0;
    const running = player.onGround && Math.abs(player.vx) > 3.5;
    const shine = gfxQuality >= 2;
    const sparkle = gfxQuality >= 3;
    // kolowrotek w powietrzu - pelny obrot narastajacy z czasem lotu
    const spinAngle = airborne ? player.airTime * 0.2 : 0;

    // HIGH/ULTRA: wyrazna, zawsze widoczna aura wokol postaci (latwo widoczna roznica vs LOW)
    if(gfxQuality >= 2){
      ctx.save();
      const auraR = gfxQuality >= 3 ? 34 : 22;
      const pulse = gfxQuality >= 3 ? (0.75 + Math.sin((timeAlive||0)*0.08)*0.25) : 1;
      const aura = ctx.createRadialGradient(px+player.w/2, py+player.h/2, 4, px+player.w/2, py+player.h/2, auraR*pulse);
      aura.addColorStop(0, gfxQuality>=3 ? 'rgba(255,225,120,.45)' : 'rgba(255,255,255,.18)');
      aura.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = aura;
      ctx.beginPath(); ctx.arc(px+player.w/2, py+player.h/2, auraR*pulse, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // ULTRA: smugi predkosci przy biegu
    if(gfxQuality >= 3 && running){
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#ffffff';
      for(let i=1;i<=3;i++){
        const trailX = px + player.w/2 - player.facing*i*10;
        ctx.beginPath();
        ctx.ellipse(trailX, py+player.h*0.6, 10-i*2, 5, 0, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    // ULTRA: smuga wirowania podczas kolowrotka
    if(sparkle && airborne){
      ctx.save();
      ctx.globalAlpha = 0.2;
      ctx.strokeStyle = '#ffe27a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(px+player.w/2, py+player.h/2, player.w*0.75, spinAngle-1.4, spinAngle);
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    // HIGH+: miekki cien/poswiata pod postacia
    if(gfxQuality >= 2){
      ctx.shadowColor = airborne && gfxQuality>=3 ? 'rgba(255,230,120,.75)' : 'rgba(0,0,0,.35)';
      ctx.shadowBlur = airborne && gfxQuality>=3 ? 22 : 10;
      ctx.shadowOffsetY = 3;
    }
    // pivot w przyblizonym srodku sylwetki, zeby kolowrotek obracal sie "w miejscu"
    ctx.translate(px + player.w/2, py + 28*scale);
    if(spinAngle) ctx.rotate(spinAngle);
    ctx.scale(player.facing*scale, scale);
    ctx.translate(-20, -28);
    drawCharacterSprite(ctx, c, bob, airborne, flat, shine, sparkle);
    ctx.restore();
  }

  function shade(hex, percent){
    const num = parseInt(hex.replace('#',''),16);
    let r = (num>>16) + Math.round(255*percent/100);
    let g = ((num>>8)&0xff) + Math.round(255*percent/100);
    let b = (num&0xff) + Math.round(255*percent/100);
    r = Math.max(0,Math.min(255,r));
    g = Math.max(0,Math.min(255,g));
    b = Math.max(0,Math.min(255,b));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function bgColors(){
    if(level.bg==='night') return {sky1:'#0b1233', sky2:'#1c2a5e', hill:'#152a4a', sun:'#dfe7ff'};
    if(level.bg==='dusk') return {sky1:'#8a4a8f', sky2:'#e0764f', hill:'#3d2352', sun:'#ffdca0'};
    if(level.bg==='volcano') return {sky1:'#3a0e0e', sky2:'#b8451c', hill:'#2a0a0a', sun:'#ff8a3d'};
    if(level.bg==='ice') return {sky1:'#bfe9ff', sky2:'#eaf7ff', hill:'#6fb8d8', sun:'#ffffff'};
    if(level.bg==='desert') return {sky1:'#ffdca0', sky2:'#ffb877', hill:'#c9862f', sun:'#fff2c9'};
    return {sky1:'#5c94fc', sky2:'#a8d8ff', hill:'#3fae4a', sun:'#fff7c2'};
  }

  function drawBackground(){
    const bc = bgColors();

    if(gfxQuality === 0){
      // LOW: plaskie tlo, bez gradientu, bez chmur/slonca, minimalne wzgorza
      ctx.fillStyle = bc.sky2;
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = bc.hill;
      for(let i=0;i<3;i++){
        const hx = ((i*420 - camera.x*0.5) % (level.width+420) + level.width+420) % (level.width+420) - 210;
        ctx.beginPath();
        ctx.arc(hx, GROUND_Y+30, 90, Math.PI, 0);
        ctx.fill();
      }
      return;
    }

    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, bc.sky1);
    grad.addColorStop(1, bc.sky2);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // HIGH+: gwiazdki na niebie nocnym
    if(gfxQuality >= 2 && (level.bg==='night' || level.bg==='volcano')){
      for(let i=0;i<40;i++){
        const sx = (i*137) % W;
        const sy = (i*71) % (H*0.5);
        const twinkle = 0.4 + 0.4*Math.abs(Math.sin((timeAlive||0)*0.03 + i));
        ctx.fillStyle = `rgba(255,255,255,${twinkle.toFixed(2)})`;
        ctx.fillRect(sx, sy, 2, 2);
      }
    }

    // HIGH+: aureola wokol slonca
    if(gfxQuality >= 2){
      ctx.save();
      ctx.globalAlpha = 0.35;
      const sunGlow = ctx.createRadialGradient(W*0.82,H*0.16,10,W*0.82,H*0.16,60);
      sunGlow.addColorStop(0, bc.sun);
      sunGlow.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sunGlow;
      ctx.beginPath(); ctx.arc(W*0.82, H*0.16, 60, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
    // ULTRA: delikatne promienie slonca (obracajace sie powoli)
    if(gfxQuality >= 3){
      ctx.save();
      ctx.translate(W*0.82, H*0.16);
      ctx.rotate((timeAlive||0)*0.002);
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = '#fff';
      for(let i=0;i<8;i++){
        ctx.rotate(Math.PI/4);
        ctx.fillRect(-3, 0, 6, 140);
      }
      ctx.restore();
    }

    ctx.fillStyle = bc.sun;
    ctx.beginPath(); ctx.arc(W*0.82, H*0.16, 34, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,.9)';
    const cloudCount = gfxQuality >= 2 ? 8 : 6;
    for(let i=0;i<cloudCount;i++){
      const cx = ((i*300 - camera.x*0.3) % (level.width+300) + level.width+300) % (level.width+300) - 150;
      const bob = gfxQuality >= 2 ? Math.sin((timeAlive||0)*0.01 + i)*4 : 0;
      drawCloud(cx, H*0.15 + (i%2)*30 + bob);
    }
    ctx.fillStyle = bc.hill;
    for(let i=0;i<8;i++){
      const hx = ((i*260 - camera.x*0.5) % (level.width+260) + level.width+260) % (level.width+260) - 130;
      ctx.beginPath();
      ctx.arc(hx, GROUND_Y+30, 90, Math.PI, 0);
      ctx.fill();
    }

    // ULTRA: delikatna winieta po brzegach ekranu
    if(gfxQuality >= 3){
      const vg = ctx.createRadialGradient(W/2,H/2,H*0.4,W/2,H/2,H*0.9);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,.35)');
      ctx.fillStyle = vg;
      ctx.fillRect(0,0,W,H);
    }
  }
  function drawCloud(x,y){
    ctx.beginPath();
    ctx.arc(x,y,18,0,Math.PI*2);
    ctx.arc(x+20,y-8,14,0,Math.PI*2);
    ctx.arc(x+36,y,18,0,Math.PI*2);
    ctx.fill();
  }

  function drawPlatforms(){
    for(const p of level.platforms){
      const x = p.x - camera.x;
      if(x+p.w < 0 || x > W) continue;
      if(p.isGround){
        ctx.fillStyle = '#8a5a2b';
        ctx.fillRect(x, p.y, p.w, H-p.y+10);
        ctx.fillStyle = '#3fae4a';
        ctx.fillRect(x, p.y, p.w, 10);
        if(gfxQuality >= 2){
          ctx.fillStyle = 'rgba(255,255,255,.15)';
          ctx.fillRect(x, p.y, p.w, 2);
        }
      } else {
        if(gfxQuality >= 2){
          ctx.fillStyle = 'rgba(0,0,0,.2)';
          ctx.beginPath(); ctx.ellipse(x+p.w/2, p.y+p.h+5, p.w/2.2, 4, 0, 0, Math.PI*2); ctx.fill();
        }
        ctx.fillStyle = '#c96a2e';
        ctx.fillRect(x, p.y, p.w, p.h);
        if(gfxQuality >= 1){
          ctx.strokeStyle = '#7a3d15';
          ctx.lineWidth = 2;
          for(let bx=0; bx<p.w; bx+=22) ctx.strokeRect(x+bx, p.y, 22, p.h);
        }
        if(gfxQuality >= 2){
          ctx.fillStyle = 'rgba(255,255,255,.2)';
          ctx.fillRect(x, p.y, p.w, 2);
        }
      }
    }
    for(const p of level.pipes){
      const x = p.x - camera.x;
      if(x+p.w < 0 || x > W) continue;
      ctx.fillStyle = '#1e9e46';
      ctx.fillRect(x, p.y, p.w, p.h);
      ctx.fillStyle = '#2ecc57';
      ctx.fillRect(x-4, p.y, p.w+8, 12);
      if(gfxQuality >= 2){
        ctx.fillStyle = 'rgba(255,255,255,.2)';
        ctx.fillRect(x+4, p.y+14, 4, p.h-16);
      }
    }
  }

  function drawCoins(){
    for(const c of level.coins){
      if(c.taken) continue;
      const x = c.x - camera.x;
      if(x < -20 || x > W+20) continue;
      const squish = Math.abs(Math.cos(c.t));
      ctx.save();
      ctx.translate(x, c.y);
      ctx.scale(squish*0.9+0.15, 1);

      if(gfxQuality >= 3){
        ctx.save();
        ctx.shadowColor = 'rgba(255,210,63,.9)';
        ctx.shadowBlur = 12;
      }

      if(gfxQuality === 0){
        ctx.fillStyle = '#ffd23f';
      } else {
        const grad = ctx.createRadialGradient(-3,-3,1,0,0,10);
        grad.addColorStop(0,'#fff6c9');
        grad.addColorStop(0.5,'#ffd23f');
        grad.addColorStop(1,'#c8860a');
        ctx.fillStyle = grad;
      }
      ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
      if(gfxQuality >= 1){
        ctx.strokeStyle = '#8a5a00';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      if(gfxQuality >= 3) ctx.restore();

      // HIGH+: iskierka
      if(gfxQuality >= 2){
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.beginPath(); ctx.ellipse(-3,-3,2,3.5,0.6,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawFlag(){
    const x = level.flag.x - camera.x;
    ctx.fillStyle = '#ccc';
    ctx.fillRect(x, level.flag.y, 6, level.flag.h);
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.moveTo(x+6, level.flag.y+6);
    ctx.lineTo(x+34, level.flag.y+16);
    ctx.lineTo(x+6, level.flag.y+26);
    ctx.fill();
  }

  function drawHazards(){
    if(!level.hazards) return;
    for(const h of level.hazards){
      const x = h.x - camera.x;
      if(x+h.w < 0 || x > W) continue;
      const spikeW = 12;
      const n = Math.max(1, Math.round(h.w / spikeW));
      const grad = ctx.createLinearGradient(x, h.y, x, h.y+h.h);
      grad.addColorStop(0, '#e8e8e8');
      grad.addColorStop(1, '#8a8f96');
      ctx.fillStyle = gfxQuality === 0 ? '#a0a5ab' : grad;
      for(let i=0;i<n;i++){
        const sx = x + i*(h.w/n);
        ctx.beginPath();
        ctx.moveTo(sx, h.y+h.h);
        ctx.lineTo(sx + h.w/n/2, h.y);
        ctx.lineTo(sx + h.w/n, h.y+h.h);
        ctx.closePath();
        ctx.fill();
      }
      if(gfxQuality >= 2){
        ctx.strokeStyle = 'rgba(0,0,0,.3)';
        ctx.lineWidth = 1;
        for(let i=0;i<n;i++){
          const sx = x + i*(h.w/n);
          ctx.beginPath();
          ctx.moveTo(sx, h.y+h.h);
          ctx.lineTo(sx + h.w/n/2, h.y);
          ctx.lineTo(sx + h.w/n, h.y+h.h);
          ctx.stroke();
        }
      }
    }
  }

  function drawMovers(){
    if(!level.movers) return;
    for(const m of level.movers){
      const x = m.x - camera.x;
      if(x+m.w < 0 || x > W) continue;
      if(gfxQuality >= 1){
        ctx.fillStyle = 'rgba(0,0,0,.2)';
        ctx.beginPath(); ctx.ellipse(x+m.w/2, m.y+m.h+6, m.w/2, 4, 0, 0, Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = '#8a5ac9';
      ctx.fillRect(x, m.y, m.w, m.h);
      ctx.fillStyle = '#c9a5f5';
      ctx.fillRect(x, m.y, m.w, 5);
      if(gfxQuality >= 1){
        ctx.strokeStyle = '#4a2a70';
        ctx.lineWidth = 2;
        ctx.strokeRect(x, m.y, m.w, m.h);
      }
      if(gfxQuality >= 3){
        ctx.fillStyle = 'rgba(255,255,255,.25)';
        ctx.fillRect(x+4, m.y+2, m.w-8, 2);
      }
    }
  }

  function drawEnemies(){
    for(const e of level.enemies){
      if(!e.alive) continue;
      const x = e.x - camera.x;
      if(x+e.w < 0 || x > W) continue;
      const walkBob = Math.sin(e.animT||0) * 2.2;
      const squash = 1 + Math.sin((e.animT||0)*2) * 0.03;
      const cx = x + e.w/2, cy = e.y + e.h/2 + walkBob*0.4;
      const bodyW = (e.w/2) * squash;
      const bodyH = (e.h/2) / squash;
      const facing = e.vx >= 0 ? 1 : -1;
      const palette = e.type==='flyer'
        ? {flat:'#3d8fd6', light:'#a8d4f7', mid:'#4f9fe0', dark:'#1e5a99', stroke:'#123a66', spike:'#1e5a99', leg:'#123a66'}
        : e.type==='jumper'
        ? {flat:'#3fae52', light:'#c8f0c8', mid:'#4fc463', dark:'#1e7a2e', stroke:'#124a1a', spike:'#1e7a2e', leg:'#124a1a'}
        : {flat:'#8a4bc7', light:'#d69bf0', mid:'#a655d6', dark:'#5e2680', stroke:'#3a1554', spike:'#4a1f66', leg:'#2c1140'};

      // cien pod nim
      if(gfxQuality >= 1){
        ctx.fillStyle = 'rgba(0,0,0,.25)';
        ctx.beginPath(); ctx.ellipse(cx, e.y+e.h+5, e.w/2, 4.5, 0, 0, Math.PI*2); ctx.fill();
      }

      // ULTRA: pulsujaca aura + drobinki (kolor zgodny z typem wroga)
      if(gfxQuality >= 3){
        const pulse = 0.5 + Math.sin((e.animT||0)*1.5)*0.5;
        ctx.save();
        ctx.globalAlpha = 0.28 + pulse*0.18;
        ctx.fillStyle = palette.mid;
        ctx.beginPath(); ctx.ellipse(cx, cy, bodyW*1.8, bodyH*1.8, 0, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        for(let i=0;i<3;i++){
          const pt = ((e.animT||0)*0.6 + i*2.1) % 6.28;
          const px2 = cx + Math.cos(pt)*(bodyW*1.9);
          const py2 = cy + Math.sin(pt)*(bodyH*1.9);
          ctx.fillStyle = palette.light;
          ctx.beginPath(); ctx.arc(px2, py2, 2.2, 0, Math.PI*2); ctx.fill();
        }
      }

      // skrzydla latacza (rysowane pod cialem, przed nozkami)
      if(e.type === 'flyer'){
        const wingFlap = Math.sin((e.animT||0)*3)*0.6;
        ctx.fillStyle = gfxQuality===0 ? '#5aa0e0' : 'rgba(140,195,245,.85)';
        ctx.save(); ctx.translate(cx-bodyW*0.85, cy-4); ctx.rotate(wingFlap);
        ctx.beginPath(); ctx.ellipse(0,0, bodyW*0.85, bodyH*0.45, 0,0,Math.PI*2); ctx.fill();
        ctx.restore();
        ctx.save(); ctx.translate(cx+bodyW*0.85, cy-4); ctx.rotate(-wingFlap);
        ctx.beginPath(); ctx.ellipse(0,0, bodyW*0.85, bodyH*0.45, 0,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }

      // nozki (przebieranie) - latacz ich nie ma, skoczek ma sprezyste odnoze
      if(e.type === 'flyer'){
        // brak nog - unosi sie w powietrzu
      } else if(e.type === 'jumper'){
        ctx.strokeStyle = palette.leg;
        ctx.lineWidth = 3;
        ctx.beginPath();
        for(let i=0;i<3;i++){
          const yy = e.y+e.h-2 - i*4;
          ctx.moveTo(cx-6, yy); ctx.lineTo(cx+6, yy-3);
        }
        ctx.stroke();
      } else {
        const stepA = Math.sin(e.animT||0);
        ctx.fillStyle = palette.spike;
        ctx.beginPath(); ctx.ellipse(cx-9, e.y+e.h-3+stepA*2, 6.5, 4.5, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cx+9, e.y+e.h-3-stepA*2, 6.5, 4.5, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = palette.leg;
        ctx.beginPath(); ctx.ellipse(cx-9, e.y+e.h+stepA*2, 5, 2.6, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cx+9, e.y+e.h-stepA*2, 5, 2.6, 0, 0, Math.PI*2); ctx.fill();
      }

      // grzbiet kolcow
      ctx.fillStyle = palette.spike;
      for(let i=-1;i<=1;i++){
        ctx.beginPath();
        ctx.moveTo(cx+i*7-4, cy-bodyH*0.75);
        ctx.lineTo(cx+i*7, cy-bodyH*1.15);
        ctx.lineTo(cx+i*7+4, cy-bodyH*0.75);
        ctx.fill();
      }

      // cialo
      if(gfxQuality === 0){
        ctx.fillStyle = palette.flat;
      } else {
        const grad = ctx.createRadialGradient(cx-bodyW*0.35, cy-bodyH*0.4, 2, cx, cy, bodyW*1.15);
        grad.addColorStop(0, palette.light);
        grad.addColorStop(0.45, palette.mid);
        grad.addColorStop(1, palette.dark);
        ctx.fillStyle = grad;
      }
      ctx.beginPath(); ctx.ellipse(cx, cy, bodyW, bodyH, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = palette.stroke;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if(gfxQuality >= 1){
        // jasny brzuch
        ctx.fillStyle = 'rgba(255,255,255,.18)';
        ctx.beginPath(); ctx.ellipse(cx, cy+bodyH*0.35, bodyW*0.6, bodyH*0.45, 0, 0, Math.PI*2); ctx.fill();

        // cetki
        ctx.fillStyle = 'rgba(60,20,80,.35)';
        ctx.beginPath(); ctx.ellipse(cx-bodyW*0.5, cy+bodyH*0.1, 3, 2.4, 0, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(cx+bodyW*0.4, cy-bodyH*0.25, 2.6, 2, 0, 0, Math.PI*2); ctx.fill();
      }

      // brwi wkurzone (zwrocone w strone ruchu)
      ctx.strokeStyle = '#2c1440';
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';
      const browShift = facing*2;
      ctx.beginPath(); ctx.moveTo(cx-11+browShift, cy-bodyH*0.55); ctx.lineTo(cx-3+browShift, cy-bodyH*0.15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx+11+browShift, cy-bodyH*0.55); ctx.lineTo(cx+3+browShift, cy-bodyH*0.15); ctx.stroke();

      // oczy (patrzace w strone ruchu)
      const eyeShift = facing*1.5;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(cx-6+eyeShift, cy+bodyH*0.05, 4.3, 5.2, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx+6+eyeShift, cy+bodyH*0.05, 4.3, 5.2, 0, 0, Math.PI*2); ctx.fill();
      if(gfxQuality >= 2){
        ctx.save();
        ctx.shadowColor = 'rgba(255,60,60,.9)';
        ctx.shadowBlur = 8;
      }
      ctx.fillStyle = '#ff3b3b';
      ctx.beginPath(); ctx.arc(cx-6+eyeShift*1.6, cy+bodyH*0.08, 2.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+6+eyeShift*1.6, cy+bodyH*0.08, 2.2, 0, Math.PI*2); ctx.fill();
      if(gfxQuality >= 2) ctx.restore();
      ctx.fillStyle = '#1a0d28';
      ctx.beginPath(); ctx.arc(cx-6+eyeShift*1.6, cy+bodyH*0.08, 0.9, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+6+eyeShift*1.6, cy+bodyH*0.08, 0.9, 0, Math.PI*2); ctx.fill();

      // zabawne zebki
      if(gfxQuality >= 1){
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(cx-5, cy+bodyH*0.55);
        ctx.lineTo(cx-2, cy+bodyH*0.42);
        ctx.lineTo(cx+1, cy+bodyH*0.55);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx+2, cy+bodyH*0.55);
        ctx.lineTo(cx+5, cy+bodyH*0.42);
        ctx.lineTo(cx+8, cy+bodyH*0.55);
        ctx.fill();
      }
    }
  }

  function draw(){
    drawBackground();
    drawPlatforms();
    drawMovers();
    drawHazards();
    drawCoins();
    drawEnemies();
    drawFlag();
    if(mpChannel) drawRemotePlayer();
    if(!player.spectating) drawPlayer();
  }

  function loop(){
    update();
    draw();
    if(!levelDone){
      rafId = requestAnimationFrame(loop);
    } else {
      cancelAnimationFrame(rafId);
    }
  }

  // init
  resizeCanvas();
  updateAuthUI();
  showScreen('menu');
  volumeSlider.value = Math.round(AudioEngine.getVolume() / 0.5 * 100);
  volumeValue.textContent = volumeSlider.value + '%';
  updateSettingsUI();

  if(sb){
    sb.auth.getSession().then(({data}) => {
      if(data.session){
        currentUser = data.session.user;
        loadProfile(currentUser).then(() => { updateAuthUI(); showScreen('menu'); });
      }
    });
    sb.auth.onAuthStateChange((_event, session) => {
      currentUser = session ? session.user : null;
      if(currentUser){
        loadProfile(currentUser).then(() => { updateAuthUI(); showScreen('menu'); });
      } else {
        updateAuthUI();
      }
    });
  }
})();
</script>
</body>
</html>
